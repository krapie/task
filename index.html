<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Daily task board — routine + bonus tasks, rotating daily" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Task" />
    <meta property="og:title" content="Task" />
    <meta property="og:description" content="Daily task board — routine + bonus tasks, rotating daily" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://task.kevinprk.com" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Task" />
    <meta name="twitter:description" content="Daily task board — routine + bonus tasks, rotating daily" />
    <title>Task</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />
    <script>
      // Paint the right theme before the bundle loads (same rule as getInitialTheme in App.tsx).
      try {
        var t = localStorage.getItem('task_theme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        background: #ffffff; color: #171717; font: 13px "JetBrains Mono", ui-monospace, Menlo, monospace; }
      html[data-theme="dark"] #boot { background: #0a0a0a; color: #fafafa; }
      #boot .mark { width: 40px; height: 40px; border-radius: 6px; background: #000; color: #fff; display: flex; align-items: center; justify-content: center;
        font: 600 22px "Inter", system-ui, sans-serif; }
      html[data-theme="dark"] #boot .mark { background: #fafafa; color: #0a0a0a; }
      #boot .bar { position: absolute; top: 0; left: 0; right: 0; height: 2px; overflow: hidden; }
      #boot .bar::after { content: ""; position: absolute; top: 0; bottom: 0; width: 35%; background: currentColor; animation: boot-slide 1s ease-in-out infinite; }
      #boot button { display: none; font: inherit; padding: 8px 14px; border: 1px solid currentColor; border-radius: 6px; background: transparent; color: inherit; }
      #boot.slow button { display: block; }
      @keyframes boot-slide { from { left: -35%; } to { left: 100%; } }
      @media (prefers-reduced-motion: reduce) { #boot .bar::after { animation: none; width: 100%; opacity: 0.4; } }
    </style>
    <script defer src="https://rum.kevinprk.com/rum.js" data-app="task"></script>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <div class="bar"></div>
        <div class="mark">π</div>
        <div id="boot-text">Loading Task…</div>
        <button type="button" onclick="location.reload()">Reload</button>
      </div>
    </div>
    <script>
      // Never look frozen: after 8 s say so and offer a reload. React replaces #boot on mount.
      setTimeout(function () {
        var b = document.getElementById('boot');
        if (!b) return;
        b.className = 'slow';
        document.getElementById('boot-text').textContent = 'Still loading — check your connection';
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
