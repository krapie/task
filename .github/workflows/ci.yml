name: CI

on:
  push:
    branches: [main]

jobs:
  # gate: generated from krapie/homeserver .github/workflows/app-gate.yml@aca66e03db9d4c1bae65eede076672e045cb7358 (inline: this repository is public)
  gate:
    if: ${{ !contains(github.event.head_commit.message, '[skip gate]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        persist-credentials: false
    - name: Go build, vet, test
      run: "set -eu\n# go version comes from each go.mod (toolchain download when newer than the runner's Go)\nfor d in ; do\n  echo \"::group::go $d\"\n  (cd \"$d\" && go build ./... && go vet ./... && go test ./...)\n  echo \"::endgroup::\"\ndone\n"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '22'
    - name: Node install, build, test
      run: "set -eu\nfor d in .; do\n  echo \"::group::node $d\"\n  # the build is the type check (tsc -b / vite / next); the Docker build repeats it, but only after this gate\n  (cd \"$d\" && npm ci --ignore-scripts --no-audit --no-fund && npm run build --if-present && npm test --if-present)\n  echo \"::endgroup::\"\ndone\n"
    - name: npm audit (warn only)
      continue-on-error: true
      run: "for d in .; do\n  (cd \"$d\" && npm audit --omit=dev --audit-level=high) || echo \"::warning::npm audit reported findings in $d\"\ndone\n"
    - name: Trivy filesystem scan (warn only)
      continue-on-error: true
      run: 'docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.67.2 fs --scanners vuln,secret --severity CRITICAL,HIGH --exit-code 0 --no-progress /src || echo "::warning::trivy could not run"

        '
  build-api:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push task-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: krapi0314/task-api:${{ steps.tag.outputs.IMAGE_TAG }}

  build-web:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'success' || needs.gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push task-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: krapi0314/task-web:${{ steps.tag.outputs.IMAGE_TAG }}

      - name: Build and push task-web staging (mock data)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          build-args: MODE=staging
          tags: krapi0314/task-web-staging:${{ steps.tag.outputs.IMAGE_TAG }}

  deploy:
    needs: [build-api, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout homeserver repo
        uses: actions/checkout@v4
        with:
          repository: krapie/homeserver
          token: ${{ secrets.GITOPS_TOKEN }}
          path: homeserver

      - name: Update image tags in deployment manifests
        env:
          IMAGE_TAG: ${{ needs.build-api.outputs.image_tag }}
        run: |
          sed -i "s|krapi0314/task-api:.*|krapi0314/task-api:${IMAGE_TAG}|" \
            homeserver/k8s/task/deployment-api.yaml
          sed -i "s|krapi0314/task-web:.*|krapi0314/task-web:${IMAGE_TAG}|; s|krapi0314/task-web-staging:.*|krapi0314/task-web-staging:${IMAGE_TAG}|" \
            homeserver/k8s/web/deployment.yaml

      - name: Commit and push manifest updates
        env:
          IMAGE_TAG: ${{ needs.build-api.outputs.image_tag }}
        run: |
          cd homeserver
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/task/deployment-api.yaml k8s/web/deployment.yaml
          # No-op when the manifest already has this tag (first deploy).
          git diff --cached --quiet && { echo "manifest unchanged"; exit 0; }
          git commit -m "deploy: task ${{ env.IMAGE_TAG }}"
          for i in $(seq 1 10); do
            git push && exit 0
            git pull --rebase
            sleep $((RANDOM % 5 + 3))
          done
          echo "::error::manifest push failed after 10 attempts"
          exit 1
