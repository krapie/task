version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 2
  ignore:
  - dependency-name: krapie/homeserver/*
